name: CI

on:
  push:
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest
    env:
      # Valores de prueba solo para CI: no son secretos reales.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/licity_ci
      BETTER_AUTH_SECRET: ci-secret-solo-para-pruebas-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      E2E_DISABLE_RATE_LIMIT: '1'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: licity_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Migraciones y datos de demo
        run: |
          npm run db:migrate
          npm run db:seed
      - run: npx playwright install --with-deps chromium
      - name: Tests de humo (Playwright)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
